<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title><%= htmlWebpackPlugin.options.title %> | Story App</title>
  </head>
  <body>
    <header>
      <navbar-content></navbar-content>
    </header>

    <main>
      <div class="main-content">
        <div class="container py-5">
          <add-story-header></add-story-header>

          <form class="row g-3 mt-3" id="addStoryForm" novalidate>
            <div class="col-12 col-md-6">
              <input-photo-with-preview
                inputId="validationCustomPhoto"
                invalidFeedbackMessage="Photo field is required"
                required
              ></input-photo-with-preview>
            </div>
            <div class="col-12 col-md-6">
              <input-with-validation
                placeholder="Name"
                type="text"
                inputId="validationCustomName"
                invalidFeedbackMessage="Name field is required"
                required
              ></input-with-validation>

              <textarea-with-validation
                placeholder="Description"
                inputId="validationCustomDescription"
                invalidFeedbackMessage="Description field is required"
                required
              ></textarea-with-validation>
            </div>
            <div class="col-12 text-end">
              <button class="btn btn-primary" type="submit">Submit</button>
            </div>
          </form>
        </div>
      </div>
    </main>

    <footer>
      <footer-content></footer-content>
    </footer>
  </body>
</html>
